name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: air, POSTGRES_PASSWORD: air, POSTGRES_DB: air_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U air" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://air:air@localhost:5432/air_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
